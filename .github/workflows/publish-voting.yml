name: Build and publish voting site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'admin.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/publish-voting.yml'

permissions:
  contents: write

concurrency:
  group: nadanu-pages-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore existing public Vite settings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('docs/index.html','utf8');
          const file = html.match(/assets\/(shared-[\w-]+\.js)/)?.[1];
          if (!file) throw Error('Current production shared bundle not found');
          const source = fs.readFileSync('docs/assets/' + file,'utf8');
          const url = source.match(/https:\/\/[a-z0-9-]+\.supabase\.co/)?.[0];
          const key = source.match(/sb_publishable_[A-Za-z0-9_-]{20,}/)?.[0];
          const turnstile = source.match(/0x4[A-Za-z0-9]{15,}/)?.[0];
          if (!url || !key || !turnstile) throw Error('Existing public build configuration unavailable; refusing to publish an unconfigured voting site');
          fs.writeFileSync('.env.production', [
            'VITE_SUPABASE_URL=' + url,
            'VITE_SUPABASE_PUBLISHABLE_KEY=' + key,
            'VITE_TURNSTILE_SITE_KEY=' + turnstile,
            ''
          ].join('\n'), {mode:0o600});
          NODE
      - name: Build production website
        env:
          VITE_BASE_PATH: /nadanu-voting/
        run: npm run build
      - name: Publish updated docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a dist/. docs/
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish voting website build [skip ci]"
            git push
          fi
